<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COME AT ME! Invite manager</title>
<style>
  :root { color-scheme: light; background: #f4f1e9; color: #182230; font: 16px/1.5 system-ui, sans-serif; }
  body { max-width: 48rem; margin: 0 auto; padding: clamp(1rem, 5vw, 3rem); }
  header { border-top: 6px solid #a13221; padding-top: 1rem; }
  small { color: #7d2d20; font-weight: 750; letter-spacing: .12em; }
  h1 { margin: .15em 0 0; font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: -.065em; line-height: 1; }
  h2 { margin: 0 0 .75rem; font-size: 1.25rem; }
  p { margin: .5rem 0; }
  section { margin: 1rem 0; padding: clamp(1rem, 4vw, 1.6rem); border: 1px solid #d4c9b6; background: #fffbf0; }
  form, label { display: grid; gap: .45rem; }
  form { gap: .85rem; }
  label, button { font-weight: 650; }
  input, button { font: inherit; min-width: 0; }
  input { padding: .6rem; border: 1px solid #8b8070; border-radius: .25rem; }
  button { padding: .55rem .85rem; border: 1px solid #8b8070; border-radius: .25rem; background: #fffbf0; color: inherit; cursor: pointer; }
  button.primary { justify-self: start; color: #fff; background: #8c2e20; border-color: #8c2e20; }
  button:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 3px solid #255683; outline-offset: 2px; }
  .fields, .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
  .fields > label { flex: 1 1 13rem; }
  .output { padding-top: .9rem; margin-top: 1rem; border-top: 1px solid #d4c9b6; }
  .output input { width: 100%; box-sizing: border-box; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: .65rem; border-top: 1px solid #d4c9b6; padding: .85rem 0; }
  li:last-child { padding-bottom: 0; }
  li strong { overflow-wrap: anywhere; }
  li p { margin: .15rem 0 0; color: #4d4a43; font-size: .9rem; }
  #status { min-height: 1.5em; }
  [hidden] { display: none !important; }
</style>
<script src="/admin/client.js" defer></script>
</head>
<body>
<header>
  <small>ZERO PAGE LABS / COME AT ME!</small>
  <h1>Invite manager</h1>
  <p>Private playtest access for publishers and playtesters.</p>
</header>
<main>
  <p id="status" role="status" aria-atomic="true">Checking sign-in…</p>
  <section id="sign-in" hidden>
    <h2>Owner sign-in</h2>
    <form id="login">
      <label>Admin password <input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary">Sign in</button>
    </form>
  </section>
  <div id="manager" hidden>
    <section>
      <h2>Create an invite</h2>
      <form id="create">
        <div class="fields">
          <label>Recipient label <input name="label" placeholder="Publisher or playtester" maxlength="100" required></label>
          <label>Expiration in your local time <input type="datetime-local" name="expires" required></label>
        </div>
        <button class="primary">Create invite</button>
      </form>
      <div class="output" id="output" hidden>
        <label>Invite link <input id="link" readonly></label>
        <p><button id="copy">Copy link</button></p>
      </div>
    </section>
    <section>
      <h2>Invites</h2>
      <p id="empty" hidden>No invites yet.</p>
      <ul id="invites"></ul>
    </section>
    <button id="logout">Sign out</button>
  </div>
</main>
</body>
</html>
